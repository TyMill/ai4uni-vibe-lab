services:
  - type: web
    name: ai4uni-workshop-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: MAX_REQUESTS_TOTAL
        value: '300'
      - key: MAX_REQUESTS_PER_MINUTE
        value: '12'
      - key: MAX_OUTPUT_TOKENS
        value: '900'
      - key: WORKSHOP_ENABLED
        value: 'true'
